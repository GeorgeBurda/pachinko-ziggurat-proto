<script>
// ==LOGIC-START== (pure game logic, shared by the page and sim.js — no DOM here)
var CONFIG = {
  STORAGE_KEY: 'pachinko_ziggurat_proto_v1',
  START_BALANCE: 10000, BALLS: 100, BALL_VALUE: 1, BET: 100,       // one round = 100 balls = 100 credits
  // slot kinds: n = credits per ball (0 = empty), 'G' = gate (ball rises to the next tier), 'J' = the tier's jackpot
  // jackpots pay a multiple of the total bet: Mini 10x, Minor 30x, Major 150x, Grand 1000x
  JP: [{ name: 'MINI', x: 10 }, { name: 'MINOR', x: 30 }, { name: 'MAJOR', x: 150 }, { name: 'GRAND', x: 1000 }],
  TIERS: [
    { name: 'I',   slots: [5, 2, 1, 0, 'G', 0, 1, 2, 'J'],             w: [1200, 3075, 14000, 31925, 800, 31925, 14000, 3075, 2] },
    { name: 'II',  slots: [150, 40, 20, 0, 'G', 0, 20, 40, 'J'],        w: [4000, 11000, 16000, 12000, 6000, 12000, 16000, 11000, 80] },
    { name: 'III', slots: [1500, 400, 150, 0, 'G', 0, 150, 400, 'J'],   w: [2500, 9000, 16000, 10000, 12000, 10000, 16000, 9000, 280] },
    { name: 'IV',  slots: [5000, 1500, 500, 200, 'J', 200, 500, 1500, 3000], w: [3000, 10000, 18000, 15000, 250, 15000, 18000, 10000, 5000] }
  ],
  // "Hanging Gardens" (kakuhen-style): reaching tier IV boosts the next N rounds: tier I gate weight x BOOST (taken from the empty slots)
  KAKUHEN: { ROUNDS: 5, GATE_BOOST: 2.5 },
  // colour hint shown on a tier's gate (or Grand) when balls arrive: weights [blue, red, gold] depending on whether a ball will pass it
  HINT_PASS: [15, 35, 50], HINT_FAIL: [78, 19, 3]

var PZ = (function () {
  var C = CONFIG;
  function mulberry32(a) { a = a >>> 0; return { next: function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; } }; }

    if (t === 0 && boosted) { var g = T.slots.indexOf('G'), add = w[g] * (C.KAKUHEN.GATE_BOOST - 1); w[g] += add; // take it evenly from the empty slots
      var em = []; T.slots.forEach(function (s, i) { if (s === 0) em.push(i); }); em.forEach(function (i) { w[i] -= add / em.length; }); }

    var W = [0, 1, 2, 3].map(function (t) { return tierWeights(t, boosted); }), S = W.map(function (w) { return w.reduce(function (a, b) { return a + b; }, 0); });

        if (v === 'G') { t++; continue; }

        else win = v * C.BALL_VALUE;

      for (var k = 0; k < forceTier; k++) { var bb = balls[k], g; total -= bb.win; if (bb.kind === 'jp') jp.splice(jp.indexOf(C.JP[bb.tier].name), 1); else perTier[bb.tier] -= bb.win;

        var s2 = wpick(rng, W[forceTier], S[forceTier]), v2 = C.TIERS[forceTier].slots[s2]; while (v2 === 'G') { s2 = wpick(rng, W[forceTier], S[forceTier]); v2 = C.TIERS[forceTier].slots[s2]; }
        p.push(s2); bb.path = p; bb.tier = forceTier; if (v2 === 'J') { bb.win = C.JP[forceTier].x * C.BET; bb.kind = 'jp'; jp.push(C.JP[forceTier].name); } else { bb.win = v2; bb.kind = 'credit'; perTier[forceTier] += v2; }

  }

})();

// ==LOGIC-END==

</script>
