    { name: 'I',   slots: [5, 2, 1, 0, 'G', 0, 1, 2, 'J'],             w: [1200, 3075, 14000, 31925, 800, 31925, 14000, 3075, 2] },
    { name: 'II',  slots: [150, 40, 20, 0, 'G', 0, 20, 40, 'J'],        w: [4000, 11000, 16000, 12000, 6000, 12000, 16000, 11000, 80] },
    { name: 'III', slots: [1500, 400, 150, 0, 'G', 0, 150, 400, 'J'],   w: [2500, 9000, 16000, 10000, 12000, 10000, 16000, 9000, 280] },

  }
